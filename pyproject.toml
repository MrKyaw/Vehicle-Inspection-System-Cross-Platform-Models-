[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-inspection-system"
version = "1.0.0"
description = "Dependency-free cross-platform vehicle inspection decision engine with geometry, manifest validation, calibration, and auditable reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "License.text" }
authors = [
  { name = "Kyaw Kyaw Oo", email = "kyaw.tech@gmail.com" },
]
keywords = [
  "vehicle-inspection",
  "computer-vision",
  "object-detection",
  "onnx",
  "pytorch",
  "webassembly",
  "calibration",
  "non-maximum-suppression",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
vehicle-inspection = "vehicle_inspection.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/Vehicle-Inspection-System-Cross-Platform-Models-"
Repository = "https://github.com/MrKyaw/Vehicle-Inspection-System-Cross-Platform-Models-"
Issues = "https://github.com/MrKyaw/Vehicle-Inspection-System-Cross-Platform-Models-/issues"

[tool.setuptools.packages.find]
include = ["vehicle_inspection*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["vehicle_inspection"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
